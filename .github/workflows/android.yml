name: Build driver app (APK)

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci || npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: |
          mkdir -p ../public
          cp android/app/build/outputs/apk/release/app-release.apk ../public/summit-chofer.apk
          ls -la ../public/summit-chofer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: summit-chofer-apk
          path: public/summit-chofer.apk

      - name: Publish APK to the website
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${GITHUB_RUN_NUMBER}" > public/summit-chofer.version
          git add public/summit-chofer.apk public/summit-chofer.version
          git commit -m "Driver app build ${GITHUB_RUN_NUMBER}" || exit 0
          # The build changes some generated files; throw those away before syncing.
          git reset --hard HEAD
          git clean -fdq -e public/summit-chofer.apk
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
